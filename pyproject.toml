[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["haiqikeji"]

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"

[project]
name = "haiqikeji-v2"
version = "0.1.0"
description = "海启科技课程平台自动刷课 CLI 工具"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "momo" }]
keywords = ["haiqikeji", "cli", "course"]
dependencies = [
    "requests>=2.33.0",
]

[project.optional-dependencies]
# 英华平台（yinghua）需要的额外依赖
yinghua = [
    "ddddocr>=1.5.0",
    "lxml>=5.0.0",
]

[project.urls]
Author = "https://xhslink.com/m/A7dz60XUVy8"

[project.scripts]
haiqikeji = "main:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long — handled by formatter
    "RUF001", # ambiguous unicode in strings (Chinese punctuation)
    "RUF002", # ambiguous unicode in docstrings (Chinese punctuation)
    "RUF003", # ambiguous unicode in comments (Chinese punctuation)
    "SIM105", # contextlib.suppress — existing try/except is clearer here
    "SIM102", # nested if — readability preferred
]

[tool.ruff.lint.isort]
known-first-party = ["haiqikeji"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "requests.*"
ignore_missing_imports = true
